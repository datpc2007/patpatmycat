<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="PatPat My Cat">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="theme-color"
content="#fffdf5">

<link rel="icon"
type="image/png"
href="icon.png">

<link rel="apple-touch-icon"
href="icon.png">

<link rel="manifest"
href='data:application/json,{
"name":"PatPat My Cat",
"short_name":"PatPat My Cat",
"display":"fullscreen",
"background_color":"#fffdf5",
"theme_color":"#fffdf5",
"start_url":"./",
"scope":"./",
"orientation":"portrait",
"icons":[
{
"src":"icon.png",
"sizes":"192x192",
"type":"image/png"
},
{
"src":"icon.png",
"sizes":"512x512",
"type":"image/png"
}
]}'>

<title>PatPat My Cat</title>

<script>

if ('serviceWorker' in navigator) {

  window.addEventListener('load',()=>{

    navigator.serviceWorker
      .register('./sw.js')
      .catch(console.error);

  });
}

</script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fffdf5;
}

body{
  cursor:none;
  user-select:none;
  touch-action:none;

  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

</style>
</head>

<body>

<canvas id="c"></canvas>

<script>

/* =========================
   CONFIG
========================= */

const CONFIG = {

  FPS: 24,

  FRAME_DELAY_MS: 5,

  STARE_TIMEOUT: 1500,

  HEAD_APPEAR_MS: 340,

  HEAD_GROW_SPEED: 0.0035
};

/* =========================
   ASSETS
========================= */

const IMG_SLEEP = new Image();
IMG_SLEEP.src = "image/cat_sleep.png";

const IMG_STARE = new Image();
IMG_STARE.src = "image/cat_stare.png";

const IMG_HEAD = new Image();
IMG_HEAD.src = "image/cat_head.png";

const HANDS = [0,1,2,3,4].map(i=>{
  const img = new Image();
  img.src = `image/hand${i}.png`;
  return img;
});

function mkAudio(src){

  const a = new Audio(src);

  a.preload = 'auto';

  return a;
}

const SND_PATS = [

  mkAudio("sound/pat0.ogg"),
  mkAudio("sound/pat1.ogg"),
  mkAudio("sound/pat2.ogg")
];

const SND_BRUH =
  mkAudio("sound/bruh.ogg");

const SND_CRAZY =
  mkAudio("sound/crazy.ogg");

function playPat(){

  const s =
    SND_PATS[
      Math.floor(
        Math.random()*SND_PATS.length
      )
    ];

  s.currentTime = 0;

  s.play().catch(()=>{});
}

function playBruh(){

  SND_BRUH.currentTime = 0;

  SND_BRUH.play().catch(()=>{});
}

function playCrazy(){

  SND_CRAZY.currentTime = 0;

  SND_CRAZY.play().catch(()=>{});
}

/* =========================
   CANVAS
========================= */

const canvas =
  document.getElementById('c');

const ctx =
  canvas.getContext('2d');

ctx.imageSmoothingEnabled = false;

let W =
  canvas.width =
  window.innerWidth;

let H =
  canvas.height =
  window.innerHeight;

/* =========================
   CAT DIMENSIONS
========================= */

let CAT_W, CAT_H;
let CAT_X, CAT_Y;

let HEAD_CX, HEAD_CY;
let HEAD_BASE;

function resetDimensions(){

  const sz =
    Math.min(W,H);

  CAT_W = sz * 0.7;

  CAT_H = sz;

  CAT_X =
    W/2 - CAT_W/2;

  CAT_Y =
    H/2 +
    CAT_H/2 -
    CAT_H;

  HEAD_BASE =
    sz * 0.6;

  HEAD_CX =
    (CAT_X + CAT_W) -
    HEAD_BASE/2;

  HEAD_CY =
    CAT_Y +
    HEAD_BASE/2 -
    sz*0.075;
}

resetDimensions();

window.addEventListener(
'resize',
()=>{

  W =
    canvas.width =
    window.innerWidth;

  H =
    canvas.height =
    window.innerHeight;

  resetDimensions();
});

/* =========================
   GAME STATE
========================= */

let state = {};

function resetGame(){

  state = {

    handFrame:0,

    frameCounter:0,

    handLoopCounter:0,

    patPlay:false,

    mx:W/2,
    my:H/2,

    stareRandom:0,

    stareCounter:0,

    catIsStaring:false,

    displayHead:false,

    headTickMs:0,

    headScale:1.0,

    stareTickMs:0,

    canPat:true,

    score:0,

    gameOver:false,

    gameOverAlpha:0,
  };
}

resetGame();

/* =========================
   PARTICLES
========================= */

let particles = [];

function updateParticles(dt){

  particles =
    particles.filter(
      p=>p.life>0
    );

  particles.forEach(p=>{

    p.x +=
      p.vx * dt * 0.06;

    p.y +=
      p.vy * dt * 0.06;

    p.vy +=
      0.2 * dt * 0.06;

    p.life -=
      0.04 * dt * 0.06;

    ctx.globalAlpha =
      p.life;

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha = 1;
  });
}

/* =========================
   COLLISION
========================= */

function circleRect(
  cx,cy,cr,
  rx,ry,rw,rh
){

  const nx =
    Math.max(
      rx,
      Math.min(cx,rx+rw)
    );

  const ny =
    Math.max(
      ry,
      Math.min(cy,ry+rh)
    );

  return (
    (cx-nx)**2 +
    (cy-ny)**2
  ) <= cr*cr;
}

/* =========================
   DRAW
========================= */

function drawCat(
  frameIdx,
  isStaring
){

  const img =
    isStaring
    ? IMG_STARE
    : IMG_SLEEP;

  let dw = CAT_W;
  let dh = CAT_H;

  if(!isStaring){

    const sf =
      frameIdx===0
      ? 1
      : 1-0.03*frameIdx;

    dh =
      CAT_H * sf;
  }

  const dx =
    W/2 - dw/2;

  const dy =
    H/2 +
    CAT_H/2 -
    dh;

  ctx.drawImage(
    img,
    dx,dy,dw,dh
  );

  if(!isStaring){

    const t =
      performance.now()/1000;

    const zOff =
      (Math.sin(t*1.2)+1)*4;

    ctx.fillStyle =
      'rgba(50,50,50,0.6)';

    ctx.font =
      `bold ${Math.min(W,H)*0.05}px Roboto`;

    ctx.textAlign='left';

    ctx.textBaseline='alphabetic';

    ctx.fillText(
      'z..Z..z',
      W/2 + dw*0.38,
      dy + dh*0.08 + zOff
    );
  }

  return {

    x:dx,
    y:dy,
    w:dw,
    h:dh
  };
}

function drawHand(
  mx,my,frame
){

  const img =
    HANDS[frame];

  const sz =
    Math.min(W,H)*0.5;

  ctx.drawImage(
    img,
    mx-sz/2,
    my-sz/2,
    sz,
    sz
  );

  return {

    cx:mx,
    cy:my,
    r:sz*0.38
  };
}

function drawBigHead(scale){

  const w =
    HEAD_BASE * scale;

  const h =
    HEAD_BASE * scale;

  ctx.drawImage(
    IMG_HEAD,
    HEAD_CX-w/2,
    HEAD_CY-h/2,
    w,
    h
  );
}

function drawScore(score){

  ctx.fillStyle='#222';

  ctx.font =
    `bold ${Math.min(W,H)*0.18}px Roboto`;

  ctx.textAlign='left';

  ctx.textBaseline='top';

  ctx.fillText(
    score,
    30,
    30
  );
}

function drawInfo(){

  ctx.fillStyle='#222';

  ctx.font =
    `bold ${Math.min(W,H)*0.05}px Roboto`;

  ctx.textAlign='right';

  ctx.textBaseline='bottom';

  ctx.fillText(
    'DatPC',
    W-30,
    H-30
  );
}

/* =========================
   MOBILE
========================= */

const isMobile =
  ('ontouchstart' in window) ||
  navigator.maxTouchPoints > 0;

/* =========================
   FPS LIMITER
========================= */

let lastFrameTime = 0;

/* =========================
   MAIN LOOP
========================= */

function loop(ts){

  requestAnimationFrame(loop);

  const frameTime =
    1000 / CONFIG.FPS;

  if(ts - lastFrameTime < frameTime)
    return;

  const dt =
    Math.min(
      ts - lastFrameTime,
      100
    );

  lastFrameTime = ts;

  const s = state;

  ctx.fillStyle='#fffdf5';

  ctx.fillRect(0,0,W,H);

  drawCat(0,false);

  drawScore(s.score);

  drawInfo();
}

/* =========================
   INPUT
========================= */

canvas.addEventListener(
'mousemove',
e=>{

  state.mx = e.clientX;

  state.my = e.clientY;
});

canvas.addEventListener(
'touchmove',
e=>{

  e.preventDefault();

  const t =
    e.touches[0];

  state.mx =
    t.clientX;

  state.my =
    t.clientY;

},
{passive:false});

/* =========================
   START
========================= */

requestAnimationFrame(loop);

</script>

</body>
</html>
